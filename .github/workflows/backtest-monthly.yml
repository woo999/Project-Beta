name: Backtest one-month strategy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_monthly_v1.py"
      - ".github/workflows/backtest-monthly.yml"
      - "docs/data/groups.json"
      - "docs/data/history/**"

permissions:
  contents: write

concurrency:
  group: woo-flow-monthly-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run walk-forward backtest
        run: python scripts/backtest_monthly_v1.py
      - name: Commit backtest result
        run: |
          git config user.name "woo-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest_monthly_v1.json
          if git diff --cached --quiet; then
            echo "No backtest changes."
          else
            git commit -m "Update one-month walk-forward backtest"
            git pull --rebase origin main
            git push
          fi
