name: Update WOO Flow market data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/update_market_data.py"
      - "scripts/update_monthly_trade_snapshots.py"
      - "scripts/backtest_monthly_v1.py"
      - "scripts/update_strategy_alerts.py"
      - ".github/workflows/market-data.yml"
      - "docs/data/groups.json"
      - "docs/data/monthly_trades.json"

permissions:
  contents: write

concurrency:
  group: woo-flow-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch historical and latest daily prices
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_market_data.py
      - name: Update open one-month trade snapshots
        run: python scripts/update_monthly_trade_snapshots.py
      - name: Run one-month walk-forward backtest
        run: python scripts/backtest_monthly_v1.py
      - name: Update WOO ALERT strategy signals
        run: python scripts/update_strategy_alerts.py
      - name: Commit refreshed data
        run: |
          git config user.name "woo-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history docs/data/latest.json docs/data/summary.json docs/data/daily_rankings.json docs/data/leader_memory.json docs/data/market_status.json docs/data/monthly_trades.json docs/data/backtest_monthly_v1.json docs/data/strategy_alerts.json
          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update WOO Flow market data"
            git pull --rebase origin main
            git push
          fi
