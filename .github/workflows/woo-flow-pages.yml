name: Deploy WOO Flow to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/woo-flow/**"
      - ".github/workflows/woo-flow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "woo-flow-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WOO Flow
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/woo-flow

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
