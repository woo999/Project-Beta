name: WOO Long Intraday Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/woo-intraday-wake.txt'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run independent intraday research
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/research_long_intraday_night.py
      - name: Commit research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_long_intraday_night.json
          if ! git diff --cached --quiet; then
            git commit -m "research: update long intraday night comparison"
            git push
          fi
