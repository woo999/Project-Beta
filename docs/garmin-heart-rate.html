<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garmin 即時心率</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#0b0b0d;color:#fff;
  font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  display:grid;place-items:center;overflow:hidden
}
.card{
  width:280px;padding:12px 14px 14px;border-radius:16px;
  background:#151519;border:1px solid #2a2a31;text-align:center;
  box-shadow:0 12px 36px rgba(0,0,0,.45)
}
.title{font-size:10px;color:#8e8e99;letter-spacing:.1em;margin-bottom:8px}
.readout{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0}
.heart{font-size:38px;color:#ff4d5f;line-height:1;transform-origin:center}
.heart.beat{animation:beat .55s ease}
@keyframes beat{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.bpm{font-size:60px;line-height:.95;font-weight:800;letter-spacing:-.04em}
.unit{font-size:12px;color:#aaa;margin-left:3px}
.status{min-height:18px;margin:9px 0 8px;color:#aaa;font-size:11px}
.status.ok{color:#67d391}.status.err{color:#ff6b78}
.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
button{
  border:0;border-radius:9px;padding:8px 11px;
  font-size:12px;font-weight:700;cursor:pointer
}
#connect{background:#fff;color:#111}
#disconnect{background:#2a2a31;color:#ddd}
#popup{background:#34343b;color:#eee}
.device{font-size:10px;color:#777;margin-top:6px}
.hint{font-size:9px;color:#666;margin-top:8px;line-height:1.35}

/* 真正的小視窗模式 */
body.mini .card{
  width:210px;
  padding:8px 10px 9px;
  border-radius:12px
}
body.mini .title,
body.mini .hint,
body.mini #popup,
body.mini .device{display:none}
body.mini .readout{gap:7px;margin:0}
body.mini .heart{font-size:30px}
body.mini .bpm{font-size:46px}
body.mini .unit{font-size:10px}
body.mini .status{font-size:9px;margin:6px 0 6px;min-height:12px}
body.mini button{font-size:10px;padding:6px 9px}
</style>
</head>
<body>
<main class="card">
  <div class="title">GARMIN LIVE HEART RATE</div>
  <div class="readout">
    <div id="heart" class="heart">♥</div>
    <div><span id="bpm" class="bpm">--</span><span class="unit">BPM</span></div>
  </div>
  <div id="status" class="status">按「連線 Garmin」開始</div>
  <div class="actions">
    <button id="connect">連線 Garmin</button>
    <button id="disconnect" hidden>中斷</button>
    <button id="popup">開啟小視窗</button>
  </div>
  <div id="device" class="device"></div>
  <div class="hint">Forerunner 965 保持「廣播心率」開啟</div>
</main>

<script>
const params=new URLSearchParams(location.search);
const isMini=params.get('mini')==='1';
if(isMini) document.body.classList.add('mini');

const bpmEl=document.getElementById('bpm');
const heartEl=document.getElementById('heart');
const statusEl=document.getElementById('status');
const deviceEl=document.getElementById('device');
const connectBtn=document.getElementById('connect');
const disconnectBtn=document.getElementById('disconnect');
const popupBtn=document.getElementById('popup');

let device=null, characteristic=null;

function setStatus(text,cls=''){
  statusEl.textContent=text;
  statusEl.className='status '+cls;
}
function parseHeartRate(v){
  return (v.getUint8(0)&1)?v.getUint16(1,true):v.getUint8(1);
}
function onHeartRateChanged(e){
  bpmEl.textContent=parseHeartRate(e.target.value);
  heartEl.classList.remove('beat');
  void heartEl.offsetWidth;
  heartEl.classList.add('beat');
  setStatus('即時心率接收中','ok');
}
async function connectGarmin(){
  try{
    if(!navigator.bluetooth) throw new Error('請用 Chrome 或 Edge 開啟');
    setStatus('請從清單選擇 Forerunner 965（可能顯示為 Garmin）…');
    device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['heart_rate']
    });
    device.addEventListener('gattserverdisconnected',()=>{
      bpmEl.textContent='--';
      setStatus('已斷線','err');
      connectBtn.hidden=false;
      disconnectBtn.hidden=true;
    });
    deviceEl.textContent=device.name?'裝置：'+device.name:'Garmin 心率裝置';
    setStatus('正在連線…');
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService('heart_rate');
    characteristic=await service.getCharacteristic('heart_rate_measurement');
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged',onHeartRateChanged);
    connectBtn.hidden=true;
    disconnectBtn.hidden=false;
    setStatus('已連線，等待心率…','ok');
  }catch(err){
    setStatus(err?.message||String(err),'err');
  }
}
function disconnectGarmin(){
  try{
    if(characteristic) characteristic.removeEventListener('characteristicvaluechanged',onHeartRateChanged);
    if(device?.gatt?.connected) device.gatt.disconnect();
  }catch(e){}
  bpmEl.textContent='--';
  setStatus('已中斷');
  connectBtn.hidden=false;
  disconnectBtn.hidden=true;
}
function openMini(){
  const url=location.origin+location.pathname+'?mini=1&v=6';
  const w=window.open(url,'garminHeartMini','popup=yes,width=250,height=180,resizable=yes,scrollbars=no');
  if(!w) setStatus('瀏覽器擋住小視窗，請允許彈出式視窗','err');
}

connectBtn.onclick=connectGarmin;
disconnectBtn.onclick=disconnectGarmin;
popupBtn.onclick=openMini;
</script>
</body>
</html>
