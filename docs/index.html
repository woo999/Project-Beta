<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOO Flow</title>
<style>
body{margin:0;background:#071014;color:#eef7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.a{max-width:1200px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:22px;font-weight:900;letter-spacing:.08em}
.sub,.mut{color:#8ba1ab;font-size:11px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.c{border:1px solid #1c343e;background:#0d181d;border-radius:14px;padding:12px}
.v{font-size:22px;font-weight:850;margin-top:4px}
.up{color:#ff6072}.down{color:#20dc92}.y{color:#ffc95c}.b{color:#44d5ff}
.grid{display:grid;grid-template-columns:1.5fr .75fr;gap:10px}
.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px;gap:10px}
.title b{font-size:14px}
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.s{min-height:145px;border-radius:12px;padding:11px;border:1px solid #28515f;background:linear-gradient(135deg,#12322f,#0b1b20);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.s:hover{border-color:#3d7181}.s.active{border-color:#44d5ff;background:linear-gradient(135deg,#163c43,#0c1d23);box-shadow:inset 0 0 0 1px #44d5ff33}
.s h2{margin:0 0 5px;font-size:17px}
.sectorReturn{font-size:19px;font-weight:850}
.stocks{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.stock{padding:5px 7px;border:1px solid #ffffff15;background:#0003;border-radius:7px;font-size:11px;color:#c8d5da}
.stock .pct{margin-left:4px;font-weight:700}
.sector-detail{display:none;margin-top:10px;border:1px solid #28515f;background:#0a171d;border-radius:12px;padding:12px}
.sector-detail.show{display:block}
.sector-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sector-head h3{margin:0;font-size:18px}
.member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.member{border:1px solid #18313a;background:#0c1b21;border-radius:9px;padding:10px}
.memberTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.member b{font-size:13px}.member small{color:#8da2ab}
.memberData{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px;font-size:11px}
.memberData span{color:#8da2ab}.memberData strong{display:block;color:#dce8ed;margin-top:2px}
.side{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:9px;border:1px solid #18313a;border-radius:9px;margin-bottom:6px}
.row small{display:block;color:#8da2ab}.score{font-weight:900}
.detail{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.m{padding:10px;border:1px solid #18313a;border-radius:9px}.m b{font-size:18px}.m small{display:block;color:#8da2ab;margin-top:3px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{border:1px solid #28515f;border-radius:999px;padding:6px 9px;font-size:11px;color:#8fa4ad;background:transparent;cursor:pointer}
.tab:hover{border-color:#3d7181;color:#dce9ee}.tab:focus-visible{outline:2px solid #44d5ff55;outline-offset:2px}
.on{background:#12303a;color:#eef7fa}
.empty{padding:12px;border:1px dashed #23414c;border-radius:9px;color:#718791;font-size:11px;line-height:1.6}
.foot{color:#657b84;font-size:10px;text-align:right;margin-top:10px}
.status{display:inline-flex;gap:5px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#20dc92}
@media(max-width:1000px){.heat{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.k{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.heat{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.heat{grid-template-columns:1fr}.member-grid{grid-template-columns:1fr}.memberData{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="a">
  <div class="top">
    <div>
      <div class="brand">WOO FLOW</div>
      <div class="sub">收盤版 · 你的族群 × 真實歷史行情</div>
    </div>
    <div class="tabs" id="rangeTabs">
      <button class="tab" type="button" data-range="1">今日</button>
      <button class="tab" type="button" data-range="5">5日</button>
      <button class="tab" type="button" data-range="10">10日</button>
      <button class="tab" type="button" data-range="20">20日</button>
      <button class="tab on" type="button" data-range="60">60日</button>
      <button class="tab" type="button" data-range="120">120日</button>
      <button class="tab" type="button" data-range="250">1年</button>
    </div>
  </div>

  <div class="k">
    <div class="c"><div class="mut">觀察期間</div><div class="v" id="rangeValue">60 日</div></div>
    <div class="c"><div class="mut">區間最強族群</div><div class="v" id="strongestGroup">載入中</div></div>
    <div class="c"><div class="mut">78 檔今日成交金額</div><div class="v" id="trackedMoney">載入中</div></div>
    <div class="c"><div class="mut">資料日期</div><div class="v" id="dataDate">載入中</div></div>
  </div>

  <div class="grid">
    <div class="c">
      <div class="title">
        <b>你的族群</b>
        <span class="mut" id="dataStatus">正在讀取收盤資料…</span>
      </div>
      <div class="heat" id="heat"></div>
      <div class="sector-detail" id="sectorDetail"></div>

      <div class="detail">
        <div class="m"><b class="b">16</b><small>正式族群</small></div>
        <div class="m"><b>78</b><small>追蹤股票</small></div>
        <div class="m"><b id="selectedSector">—</b><small>目前選取族群</small></div>
        <div class="m"><b>—</b><small>領漲 DNA（下一階段）</small></div>
      </div>
    </div>

    <div class="side">
      <div class="c">
        <div class="title"><b>區間領先股</b><span class="mut" id="leaderRangeLabel">近 60 日</span></div>
        <div id="leaders"><div class="empty">載入中…</div></div>
      </div>

      <div class="c">
        <div class="title"><b>最新交易日族群排名</b><span class="mut" id="dailyRankDate">載入中…</span></div>
        <div id="dailyRanks"><div class="empty">載入中…</div></div>
      </div>

      <div class="c">
        <div class="title"><b>資料狀態</b><span class="mut">每日收盤更新</span></div>
        <div id="sourceInfo" class="empty">載入中…</div>
      </div>

      <div class="c">
        <div class="title"><b>領漲記憶</b><span class="mut" id="memoryRangeLabel">近 60 日</span></div>
        <div id="leaderMemory"><div class="empty">選一個族群後，這裡會顯示發動日與重複領漲統計。</div></div>
      </div>
    </div>
  </div>

  <div class="foot">WOO FLOW · 收盤資料來源：FinMind TaiwanStockPrice · 非即時行情</div>
</div>

<script>
const GROUPS = [{"name":"軟體","symbols":["6112","6148","6140","2468"],"members":[{"code":"6112","name":"邁達特"},{"code":"6148","name":"驊宏資"},{"code":"6140","name":"訊達"},{"code":"2468","name":"華經"}]},{"name":"航運","symbols":["2609","2615","2603"],"members":[{"code":"2609","name":"陽明"},{"code":"2615","name":"萬海"},{"code":"2603","name":"長榮"}]},{"name":"矽晶圓","symbols":["6182","6488","3532","3707"],"members":[{"code":"6182","name":"合晶"},{"code":"6488","name":"環球晶"},{"code":"3532","name":"台勝科"},{"code":"3707","name":"漢磊"}]},{"name":"BBU","symbols":["5309","3323","4931","6558","3211"],"members":[{"code":"5309","name":"系統電"},{"code":"3323","name":"加百裕"},{"code":"4931","name":"新盛力"},{"code":"6558","name":"興能高"},{"code":"3211","name":"順達"}]},{"name":"PCB","symbols":["3189","8046","3037","3715","4927"],"members":[{"code":"3189","name":"景碩"},{"code":"8046","name":"南電"},{"code":"3037","name":"欣興"},{"code":"3715","name":"定穎投控"},{"code":"4927","name":"泰鼎-KY"}]},{"name":"記憶體MU","symbols":["6770","2408","2344","3006","5351","5289"],"members":[{"code":"6770","name":"力積電"},{"code":"2408","name":"南亞科"},{"code":"2344","name":"華邦電"},{"code":"3006","name":"晶豪科"},{"code":"5351","name":"鈺創"},{"code":"5289","name":"宜鼎"}]},{"name":"記憶體SNDK","symbols":["8299","3260","2451","4967","2337"],"members":[{"code":"8299","name":"群聯"},{"code":"3260","name":"威剛"},{"code":"2451","name":"創見"},{"code":"4967","name":"十銓"},{"code":"2337","name":"旺宏"}]},{"name":"面板","symbols":["6116","2409","3481","8105","6120"],"members":[{"code":"6116","name":"彩晶"},{"code":"2409","name":"友達"},{"code":"3481","name":"群創"},{"code":"8105","name":"凌巨"},{"code":"6120","name":"達運"}]},{"name":"被動元件","symbols":["6155","2492","2327","5328","8043","2375","6173","8261"],"members":[{"code":"6155","name":"鈞寶"},{"code":"2492","name":"華新科"},{"code":"2327","name":"國巨"},{"code":"5328","name":"華容"},{"code":"8043","name":"蜜望實"},{"code":"2375","name":"凱美"},{"code":"6173","name":"信昌電"},{"code":"8261","name":"富鼎"}]},{"name":"軍工","symbols":["8222","8033","6753","2630","2634"],"members":[{"code":"8222","name":"寶一"},{"code":"8033","name":"雷虎"},{"code":"6753","name":"龍德造船"},{"code":"2630","name":"亞航"},{"code":"2634","name":"漢翔"}]},{"name":"石英","symbols":["2484","3042","6174","8182"],"members":[{"code":"2484","name":"希華"},{"code":"3042","name":"晶技"},{"code":"6174","name":"安碁"},{"code":"8182","name":"加高"}]},{"name":"機器人","symbols":["4540","1597","2359","4576"],"members":[{"code":"4540","name":"全球傳動"},{"code":"1597","name":"直得"},{"code":"2359","name":"所羅門"},{"code":"4576","name":"大銀微系統"}]},{"name":"散熱","symbols":["3324","3017"],"members":[{"code":"3324","name":"雙鴻"},{"code":"3017","name":"奇鋐"}]},{"name":"矽光","symbols":["3081","3163","3450","6442","3363","4991","4979","4908","4971"],"members":[{"code":"3081","name":"聯亞"},{"code":"3163","name":"波若威"},{"code":"3450","name":"聯鈞"},{"code":"6442","name":"光聖"},{"code":"3363","name":"上詮"},{"code":"4991","name":"環宇-KY"},{"code":"4979","name":"華星光"},{"code":"4908","name":"前鼎"},{"code":"4971","name":"IET-KY"}]},{"name":"南亞族群","symbols":["1303","5475","1802","5340","8358","1815"],"members":[{"code":"1303","name":"南亞"},{"code":"5475","name":"德宏"},{"code":"1802","name":"台玻"},{"code":"5340","name":"建榮"},{"code":"8358","name":"金居"},{"code":"1815","name":"富喬"}]},{"name":"光學","symbols":["3441","3362","3406"],"members":[{"code":"3441","name":"聯一光"},{"code":"3362","name":"先進光"},{"code":"3406","name":"玉晶光"}]}];
let selectedRange = 60;
let selectedGroupIndex = null;
let LATEST = {};
let SUMMARY = null;
let DAILY = null;
let MEMORY = null;

const heat = document.getElementById('heat');
const sectorDetail = document.getElementById('sectorDetail');

const fmtPct = v => Number.isFinite(v) ? (v > 0 ? '+' : '') + v.toFixed(2) + '%' : '—';
const cls = v => Number.isFinite(v) ? (v > 0 ? 'up' : v < 0 ? 'down' : '') : '';
const fmtPrice = v => Number.isFinite(v) ? v.toLocaleString('zh-TW',{maximumFractionDigits:2}) : '—';
const fmtMoney = v => Number.isFinite(v) ? (v/100000000).toLocaleString('zh-TW',{maximumFractionDigits:2}) + ' 億' : '—';
const fmtVolume = v => Number.isFinite(v) ? Math.round(v/1000).toLocaleString('zh-TW') + ' 張' : '—';
const rangeText = value => value === 1 ? '今日' : value === 250 ? '1 年' : value + ' 日';
const nearText = value => value === 1 ? '今日' : value === 250 ? '近 1 年' : '近 ' + value + ' 日';

function rangeSummary(){
  if(selectedRange===1){
    const day=latestDailyDay();
    if(!day) return null;
    const top=day.groups?.[0] || null;
    return {
      groups:(day.groups||[]).map(g=>({
        name:g.name,
        avg_return:g.avg_pct,
        avg_latest_pct:g.avg_pct,
        latest_money:g.total_money,
        leaders:(g.leaders||[]).map(x=>({
          code:x.code,name:x.name,period_return:x.pct,latest_pct:x.pct,
          latest_money:x.money,latest_volume:x.volume,latest_close:x.close
        }))
      })),
      strongest_group:top?.name || null,
      strongest_group_return:top?.avg_pct ?? null
    };
  }
  return SUMMARY?.ranges?.[String(selectedRange)] || null;
}
function groupSummary(name){
  return rangeSummary()?.groups?.find(g=>g.name===name) || null;
}
function stockSummary(code){
  if(selectedRange===1){
    const q=LATEST[code];
    return q ? {
      period_return:q.pct,
      latest_pct:q.pct,
      latest_money:q.money,
      latest_volume:q.volume,
      latest_close:q.close
    } : null;
  }
  return SUMMARY?.stocks?.[code]?.[String(selectedRange)] || null;
}

function renderTop(){
  document.getElementById('rangeValue').textContent = rangeText(selectedRange);
  const rs = rangeSummary();
  if(rs?.strongest_group){
    document.getElementById('strongestGroup').innerHTML = rs.strongest_group + ' <span class="' + cls(rs.strongest_group_return) + '" style="font-size:13px">' + fmtPct(rs.strongest_group_return) + '</span>';
  } else {
    document.getElementById('strongestGroup').textContent = '—';
  }
  document.getElementById('trackedMoney').textContent = fmtMoney(SUMMARY?.latest_money_unique);
  document.getElementById('dataDate').textContent = SUMMARY?.latest_date || '—';
  document.getElementById('leaderRangeLabel').textContent = nearText(selectedRange);
}

function renderHeat(){
  heat.innerHTML = GROUPS.map((g,i)=>{
    const gs = groupSummary(g.name);
    const members = g.members || [];
    return `
      <div class="s ${selectedGroupIndex===i?'active':''}" data-index="${i}" role="button" tabindex="0" aria-label="查看 ${g.name}">
        <h2>${g.name}</h2>
        <div class="sectorReturn ${cls(gs?.avg_return)}">${fmtPct(gs?.avg_return)}</div>
        <div class="mut">${selectedRange===1 ? "今日族群平均" : `區間平均 · 今日均幅 <span class="${cls(gs?.avg_latest_pct)}">${fmtPct(gs?.avg_latest_pct)}</span>`}</div>
        <div class="stocks">
          ${members.map(m=>{
            const q=LATEST[m.code];
            return `<span class="stock">${m.name}<span class="pct ${cls(q?.pct)}">${fmtPct(q?.pct)}</span></span>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  heat.querySelectorAll('.s').forEach(el=>{
    const open=()=>openSector(Number(el.dataset.index));
    el.addEventListener('click',open);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
}

function latestDailyDay(){
  const days = DAILY?.days || [];
  return days.length ? days[days.length-1] : null;
}

function memoryGroup(name){
  return MEMORY?.ranges?.[String(selectedRange)]?.groups?.find(g=>g.name===name) || null;
}

function renderLeaderMemory(){
  const box=document.getElementById('leaderMemory');
  const label=document.getElementById('memoryRangeLabel');
  if(label) label.textContent=nearText(selectedRange);

  if(selectedGroupIndex===null){
    box.innerHTML='<div class="empty">先點一個族群。系統會統計該族群在「發動日」裡，哪些股票最常進入當日漲幅前三。</div>';
    return;
  }

  const g=GROUPS[selectedGroupIndex];
  if(selectedRange===1){
    box.innerHTML='<div class="empty">「今日」只看當日戰況，不計算領漲記憶率。請切到 5日、10日、20日、60日、120日或1年。</div>';
    return;
  }
  const mg=memoryGroup(g.name);
  if(!mg){
    box.innerHTML='<div class="empty">領漲記憶資料尚未產生。</div>';
    return;
  }

  const rows=(mg.stocks||[]).filter(x=>x.top3_count>0).slice(0,5);
  const rule='發動日：族群當日排名前3＋平均漲幅≥2%＋至少60%成員上漲';

  if(!mg.activation_days){
    box.innerHTML='<div class="empty">'+g.name+' 在這個期間沒有符合 v1 規則的發動日。<br>'+rule+'</div>';
    return;
  }

  box.innerHTML=
    '<div class="empty" style="margin-bottom:8px">'+g.name+' · 發動日 <b>'+mg.activation_days+'</b> 天<br>'+rule+'</div>'+
    rows.map((x,i)=>`
      <div class="row">
        <span>#${i+1}</span>
        <div><b>${x.name}</b><small>${x.code} · 第一名 ${x.top1_count} 次</small></div>
        <span class="score y">${x.top3_count}/${mg.activation_days} · ${x.top3_rate}%</span>
      </div>`).join('');
}

function renderDailyRanks(){
  const box = document.getElementById('dailyRanks');
  const dateEl = document.getElementById('dailyRankDate');
  const day = latestDailyDay();
  if(!day){
    dateEl.textContent='尚未產生';
    box.innerHTML='<div class="empty">每日族群排名資料尚未產生。</div>';
    return;
  }
  dateEl.textContent=day.date;
  const top=(day.groups||[]).slice(0,5);
  box.innerHTML=top.map(g=>`
    <div class="row">
      <span>#${g.rank}</span>
      <div><b>${g.name}</b><small>上漲 ${g.up_count}/${g.priced_members} · ≥3% ${g.gt3_count}</small></div>
      <span class="score ${cls(g.avg_pct)}">${fmtPct(g.avg_pct)}</span>
    </div>`).join('');
}

function renderLeaders(){
  const box=document.getElementById('leaders');
  let rows=[];
  if(selectedGroupIndex!==null){
    const g=GROUPS[selectedGroupIndex];
    rows=(groupSummary(g.name)?.leaders||[]).slice(0,5);
  } else if(selectedRange===1){
    rows=Object.values(LATEST).map(q=>({
      code:q.code,name:q.name,period_return:q.pct,
      group:(GROUPS.find(g=>(g.members||[]).some(m=>m.code===q.code))?.name||'')
    })).sort((a,b)=>(b.period_return??-999)-(a.period_return??-999)).slice(0,5);
  } else {
    rows=GROUPS.flatMap(g=>(g.members||[]).map(m=>{
      const st=stockSummary(m.code);
      return st ? {code:m.code,name:m.name,...st,group:g.name} : null;
    }).filter(Boolean)).sort((a,b)=>(b.period_return??-999)-(a.period_return??-999)).slice(0,5);
  }
  if(!rows.length){ box.innerHTML='<div class="empty">目前沒有可用區間資料。</div>'; return; }
  box.innerHTML=rows.map((x,i)=>`
    <div class="row">
      <span>#${i+1}</span>
      <div><b>${x.name}</b><small>${x.code}${x.group?' · '+x.group:''}</small></div>
      <span class="score ${cls(x.period_return)}">${fmtPct(x.period_return)}</span>
    </div>`).join('');
}

function openSector(index){
  const g=GROUPS[index];
  if(!g) return;
  selectedGroupIndex=index;
  document.getElementById('selectedSector').textContent=g.name;
  renderHeat();
  renderLeaders();
  renderLeaderMemory();

  const todayGroup = latestDailyDay()?.groups?.find(x=>x.name===g.name);
  const rows=(g.members||[]).map(m=>({
    ...m,
    latest:LATEST[m.code]||{},
    stat:stockSummary(m.code)||{}
  })).sort((a,b)=>(b.stat.period_return??-999)-(a.stat.period_return??-999));

  sectorDetail.innerHTML=`
    <div class="sector-head">
      <div><h3>${g.name}</h3><div class="mut">${rows.length} 檔 · ${nearText(selectedRange)}</div></div>
      <span class="mut">紅＝上漲 · 綠＝下跌</span>
    </div>
    ${todayGroup ? `
      <div class="empty" style="margin-top:10px">
        今日族群排名：#${todayGroup.rank} · 平均 ${fmtPct(todayGroup.avg_pct)} · 上漲 ${todayGroup.up_count}/${todayGroup.priced_members} · 3%以上 ${todayGroup.gt3_count} 檔<br>
        今日領漲前三：${(todayGroup.leaders||[]).map((x,i)=>'#'+(i+1)+' '+x.name+' '+fmtPct(x.pct)).join('　')}
      </div>` : ''}
    <div class="member-grid">
      ${rows.map(x=>`
        <div class="member">
          <div class="memberTop">
            <div><b>${x.name}</b><small> ${x.code}</small></div>
            <strong class="${cls(x.stat.period_return)}">${fmtPct(x.stat.period_return)}</strong>
          </div>
          <div class="memberData">
            <div><span>收盤</span><strong>${fmtPrice(x.latest.close)}</strong></div>
            <div><span>今日</span><strong class="${cls(x.latest.pct)}">${fmtPct(x.latest.pct)}</strong></div>
            <div><span>成交量</span><strong>${fmtVolume(x.latest.volume)}</strong></div>
            <div><span>成交金額</span><strong>${fmtMoney(x.latest.money)}</strong></div>
          </div>
        </div>`).join('')}
    </div>`;
  sectorDetail.classList.add('show');
  sectorDetail.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function setRange(value){
  selectedRange=value;
  document.querySelectorAll('#rangeTabs .tab').forEach(btn=>btn.classList.toggle('on',Number(btn.dataset.range)===value));
  renderTop();
  renderHeat();
  renderLeaders();
  renderLeaderMemory();
  if(selectedGroupIndex!==null) openSector(selectedGroupIndex);
}

async function loadData(){
  try{
    const stamp=Date.now();
    const [latestRes,summaryRes,dailyRes,memoryRes,statusRes]=await Promise.all([
      fetch('data/latest.json?v='+stamp),
      fetch('data/summary.json?v='+stamp),
      fetch('data/daily_rankings.json?v='+stamp),
      fetch('data/leader_memory.json?v='+stamp),
      fetch('data/market_status.json?v='+stamp)
    ]);
    if(!latestRes.ok||!summaryRes.ok) throw new Error('market data not ready');
    const latest=await latestRes.json();
    SUMMARY=await summaryRes.json();
    DAILY=dailyRes.ok?await dailyRes.json():null;
    MEMORY=memoryRes.ok?await memoryRes.json():null;
    LATEST=latest.stocks||{};
    const status=statusRes.ok?await statusRes.json():null;
    document.getElementById('dataStatus').innerHTML='<span class="status"><span class="dot"></span>真實收盤資料已載入 · '+Object.keys(LATEST).length+' 檔</span>';
    document.getElementById('sourceInfo').innerHTML=
      '來源：FinMind TaiwanStockPrice<br>'+
      '資料日期：'+(SUMMARY.latest_date||'—')+'<br>'+
      '歷史起點：'+(status?.earliest_date||'—')+'<br>'+
      '成功：'+(status?.successes??'—')+' / '+(status?.requested_stocks??'—')+' 檔';
    renderTop();renderHeat();renderLeaders();renderDailyRanks();renderLeaderMemory();
  }catch(err){
    document.getElementById('dataStatus').textContent='資料載入失敗，請稍後重新整理';
    document.getElementById('sourceInfo').textContent='summary.json 尚未部署完成或載入失敗。';
    renderHeat();renderDailyRanks();renderLeaderMemory();
  }
}

document.querySelectorAll('#rangeTabs .tab').forEach(btn=>{
  btn.addEventListener('click',()=>setRange(Number(btn.dataset.range)));
});

renderHeat();
loadData();
</script>
</body>
</html>
